# Local synthetic-patient demo. Use with docker-compose.yml via npm run demo.
services:
  deepphe-visualizer-v2:
    depends_on:
      demo-api:
        condition: service_healthy

  demo-api:
    image: node:18-alpine
    container_name: deepphe-local-mock
    working_dir: /app
    command: ["node", "mock-api/server.js"]
    ports:
      - "127.0.0.1:3333:3333"
    volumes:
      - ./mock-api:/app/mock-api:ro
      - ./public/data/demographics:/app/public/data/demographics:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3333/openapi.json', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - deepphe-network
